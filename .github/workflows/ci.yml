name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version de pnpm vient de `packageManager` dans le package.json racine.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      # Le build n'exécute pas le throw de supabase.ts, mais vite-plugin-pwa (V1)
      # a besoin d'une vraie chaîne quand il substitue import.meta.env.
      - name: Build V1
        run: pnpm --filter web build
        env:
          VITE_SUPABASE_URL: https://ci.local.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      - name: Build V2
        run: pnpm --filter web-v2 build
        env:
          VITE_SUPABASE_URL: https://ci.local.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder

      - name: Test
        run: pnpm -r test
