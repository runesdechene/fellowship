[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# V2 en construction (apps/web-v2) : même origine que la V1, donc même session.
# Le site V2 publie dist/ à sa racine avec base /v2/ — la redirection retire /v2.
# ATTENTION — pas de règle « /v2 → /v2/ » : chez RdC elle bouclait (30/09/2026).
# /v2/* couvre /v2 et /v2/. Elle doit rester AVANT le SPA fallback (première règle qui gagne).
[[redirects]]
  from = "/v2/*"
  to = "https://fellowship-web-v2.netlify.app/:splat"
  status = 200
  force = true

# SPA fallback - toutes les routes vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Default security headers (apply to all routes unless overridden below)
# X-Frame-Options is omitted intentionally — modern browsers respect CSP
# `frame-ancestors`, and we need path-specific control for the embed widget.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://tiles.openfreemap.org; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tiles.openfreemap.org https://api-adresse.data.gouv.fr https://photon.komoot.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:;"

# Embed widget — public, must be iframable from artists' websites
[[headers]]
  for = "/*/embed"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://tiles.openfreemap.org; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://tiles.openfreemap.org; frame-ancestors *; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:;"

# Hashed assets — long-term immutable cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Embed loader — cache court pour propager les améliorations sans re-collage client.
# DOIT rester APRÈS la règle /*.js : sur Netlify, à match multiple, la DERNIÈRE règle
# du fichier gagne (pas la plus spécifique). Avant /*.js, l'immutable l'écrasait.
[[headers]]
  for = "/embed.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
