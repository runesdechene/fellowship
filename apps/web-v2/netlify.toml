# Site fellowship-web-v2 — joint par la V1 via la redirection /v2/* (apps/web/netlify.toml).
# Il sert dist/ à sa racine ; tout chemin inconnu revient à index.html (le routeur décide).
[build]
  command = "pnpm build"
  publish = "dist"

# Un fichier de build introuvable (onglet resté sur une ancienne version) répond 404, et non
# index.html : sinon le navigateur reçoit du HTML à la place d'un script, mis en cache pour un an.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
